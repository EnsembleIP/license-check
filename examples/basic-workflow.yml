# Example: Basic License Check Workflow
# Copy this file to .github/workflows/license-check.yml in your repository

name: License Check

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  issues: write

jobs:
  license-check:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run License Check
        uses: ensembleip/license-check@v1
        # All inputs are optional - defaults will be used if not specified
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}